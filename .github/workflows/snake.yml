# Redraws the contribution snake at the bottom of the profile every 12 hours.
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0284C7&color_dots=#EBEDF0,#C6C6C6,#8A8A8A,#4A4A4A,#111111
            dist/snake-dark.svg?color_snake=#38BDF8&color_dots=#161616,#2E2E2E,#5C5C5C,#A3A3A3,#FAFAFA&color_background=#0D1117

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
