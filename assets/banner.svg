<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Building FinalPing</title>
  <desc id="d">An aircraft flies an approach, pinging as it crosses the 10, 5 and 2 nautical mile rings, and lands.</desc>
  <style>
    .sans { font-family: Geist, Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "Geist Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .ring { fill: none; stroke: #2E2E2E; stroke-width: 1.5; stroke-dasharray: 4 7; }
    .ping { fill: none; stroke: #38BDF8; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .plane { animation: fly 7s linear infinite; }
    .p1 { animation: ping1 7s ease-out infinite; }
    .p2 { animation: ping2 7s ease-out infinite; }
    .p3 { animation: ping3 7s ease-out infinite; }
    .dot { animation: live 2.4s ease-in-out infinite; }
    @keyframes fly {
      0% { transform: translate(730px, 160px); opacity: 0; }
      5% { opacity: 1; }
      80% { transform: translate(1078px, 160px); opacity: 1; }
      88%, 100% { transform: translate(1078px, 160px); opacity: 0; }
    }
    @keyframes ping1 { 0%, 16% { opacity: 0; transform: scale(0.2); } 17% { opacity: 1; } 30%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes ping2 { 0%, 41% { opacity: 0; transform: scale(0.2); } 42% { opacity: 1; } 55%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes ping3 { 0%, 62% { opacity: 0; transform: scale(0.2); } 63% { opacity: 1; } 76%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .m { opacity: 0; }
    .m1 { animation: m1 7s linear infinite; }
    .m2 { animation: m2 7s linear infinite; }
    .m3 { animation: m3 7s linear infinite; }
    .m4 { animation: m4 7s linear infinite; }
    @keyframes m1 { 0%, 16% { opacity: 0; } 17%, 41% { opacity: 1; } 42%, 100% { opacity: 0; } }
    @keyframes m2 { 0%, 41% { opacity: 0; } 42%, 62% { opacity: 1; } 63%, 100% { opacity: 0; } }
    @keyframes m3 { 0%, 62% { opacity: 0; } 63%, 79% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes m4 { 0%, 79% { opacity: 0; } 80%, 97% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .plane, .p1, .p2, .p3, .dot, .m1, .m2, .m3, .m4 { animation: none; }
      .m2 { opacity: 1; }
      .plane { transform: translate(950px, 160px); }
    }
  </style>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="18" fill="#000" stroke="#1F1F1F" stroke-width="1.5"/>

  <!-- words -->
  <text x="64" y="92" class="mono" font-size="13" letter-spacing="2.5" fill="#7A7A7A">SHERMR6 · FINALPING</text>
  <text x="62" y="160" class="sans" font-size="58" font-weight="700" letter-spacing="-2" fill="#FAFAFA">Building FinalPing.</text>
  <text x="64" y="204" class="sans" font-size="20" fill="#A3A3A3">Arrival alerts for general aviation,</text>
  <text x="64" y="232" class="sans" font-size="20" fill="#A3A3A3">from 10 nm out to wheels down.</text>
  <g transform="translate(64 256)">
    <rect width="176" height="32" rx="16" fill="#0E0E0E" stroke="#2A2A2A"/>
    <circle class="dot" cx="18" cy="16" r="4" fill="#38BDF8"/>
    <text x="32" y="21" class="mono" font-size="13" fill="#EDEDED">finalpingapp.com</text>
  </g>

  <!-- the approach: rings around the runway threshold at (1080, 160) -->
  <line x1="700" y1="160" x2="1080" y2="160" stroke="#1E1E1E" stroke-width="1.5" stroke-dasharray="2 6"/>
  <path class="ring" d="M 826.2 278.4 A 280 280 0 0 1 826.2 41.6"/>
  <path class="ring" d="M 925.9 231.8 A 170 170 0 0 1 925.9 88.2"/>
  <path class="ring" d="M 1007.5 193.8 A 80 80 0 0 1 1007.5 126.2"/>
  <text x="820" y="34" class="mono" font-size="12" fill="#5C5C5C">10 nm</text>
  <text x="926" y="80" class="mono" font-size="12" fill="#5C5C5C">5 nm</text>
  <text x="1006" y="118" class="mono" font-size="12" fill="#5C5C5C">2 nm</text>

  <!-- runway -->
  <rect x="1080" y="151" width="100" height="18" rx="2" fill="#1A1A1A" stroke="#3A3A3A"/>
  <line x1="1090" y1="160" x2="1172" y2="160" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="8 6"/>
  <g stroke="#8A8A8A" stroke-width="1.5">
    <line x1="1084" y1="154" x2="1084" y2="166"/><line x1="1087" y1="154" x2="1087" y2="166"/>
  </g>

  <!-- a ping where the approach crosses each ring -->
  <circle class="ping p1" cx="800" cy="160" r="26"/>
  <circle class="ping p2" cx="910" cy="160" r="26"/>
  <circle class="ping p3" cx="1000" cy="160" r="26"/>

  <!-- the alert it sends -->
  <g transform="translate(958 252)">
    <rect width="214" height="44" rx="10" fill="#0E0E0E" stroke="#2A2A2A"/>
    <circle cx="18" cy="22" r="4" fill="#38BDF8"/>
    <text x="32" y="19" class="mono" font-size="11" fill="#7A7A7A">N172AK · KDTO</text>
    <text x="32" y="35" class="sans m m1" font-size="13" font-weight="600" fill="#FAFAFA">Crossed 10 nm · ETA 9 min</text>
    <text x="32" y="35" class="sans m m2" font-size="13" font-weight="600" fill="#FAFAFA">Crossed 5 nm · ETA 5 min</text>
    <text x="32" y="35" class="sans m m3" font-size="13" font-weight="600" fill="#FAFAFA">Crossed 2 nm · ETA 2 min</text>
    <text x="32" y="35" class="sans m m4" font-size="13" font-weight="600" fill="#FAFAFA">Landed · Runway 18L</text>
  </g>

  <!-- the aircraft, nose to the right -->
  <g class="plane">
    <path d="M 14 0 L 4 -2 L -2 -14 L -6 -14 L -3 -2 L -11 -2 L -14 -6 L -16 -6 L -14 0 L -16 6 L -14 6 L -11 2 L -3 2 L -6 14 L -2 14 L 4 2 Z" fill="#FAFAFA"/>
  </g>
</svg>
